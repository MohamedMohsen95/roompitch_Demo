<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomPitch Room Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table workspace. Library on the left, plan + 3D side by side in the middle, live estimate on the right. */
:root{
  --bg:#e9ecea; --surface:#ffffff; --sunk:#f3f5f4; --ink:#1b2220; --muted:#5f6b67; --line:#d3d9d6;
  --accent:#2c6a5c; --accent-ink:#ffffff; --accent-soft:rgba(44,106,92,.12); --stage:#dfe4e1; --grid:rgba(27,34,32,.07);
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1e; --sunk:#151a19; --ink:#e6ebe9; --muted:#97a39f; --line:#2b3331;
  --accent:#5fb39d; --accent-ink:#0d1211; --accent-soft:rgba(95,179,157,.16); --stage:#202725; --grid:rgba(230,235,233,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --sunk:#151a19; --ink:#e6ebe9; --muted:#97a39f; --line:#2b3331;
  --accent:#5fb39d; --accent-ink:#0d1211; --accent-soft:rgba(95,179,157,.16); --stage:#202725; --grid:rgba(230,235,233,.06); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:14px 24px; display:flex; flex-direction:column; gap:12px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Top bar */
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px}
.brand{display:flex; align-items:baseline; gap:10px; margin-inline-end:auto}
.brand strong{font-size:17px; letter-spacing:.2px}
.tag{font-size:12px; color:var(--muted); border:1px dashed var(--line); padding:1px 8px; border-radius:20px}
.dims{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.dims label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.dims input{width:64px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:var(--sunk); font-family:var(--font-data); text-align:center; direction:ltr}
.btn{border:1px solid var(--line); background:var(--sunk); padding:6px 12px; border-radius:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; padding:8px 18px}

/* Main grid */
.app{display:grid; grid-template-columns:250px minmax(0,1fr) 270px; gap:12px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; min-width:0}
.panel h2{font-size:13px; font-weight:600; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px}
.panel h2 small{font-weight:400; color:var(--muted); font-size:12px}

/* Library */
.tabs{display:flex; gap:4px; padding:10px 10px 0}
.tabs button{flex:1; border:1px solid var(--line); background:var(--sunk); border-radius:7px; padding:6px 4px; font-size:13px}
.tabs button[aria-selected="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.lib{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:10px; max-height:430px; overflow:auto}
.tile{min-width:0; border:1px solid var(--line); background:var(--sunk); border-radius:8px; padding:6px; text-align:start; display:flex; flex-direction:column; gap:5px; cursor:grab; user-select:none; touch-action:manipulation}
.tile:hover{border-color:var(--accent)}
.tile:active{cursor:grabbing}
.lib.replacing .tile{border-color:var(--accent); background:var(--accent-soft)}
.sw{height:46px; border-radius:5px; background-size:cover; border:1px solid var(--line); position:relative}
.sw .fp{position:absolute; inset:0; margin:auto; border-radius:2px}
.tile b{font-size:12.5px; font-weight:500; line-height:1.3; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tile span{font-size:11.5px; color:var(--muted); font-family:var(--font-data); direction:ltr; text-align:end}
.hint{font-size:12px; color:var(--muted); padding:0 12px 12px; margin:0}

.inspect{padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; min-height:62px}
.inspect .what{font-size:13px}
.inspect .what em{font-style:normal; color:var(--muted); font-size:12px; display:block}
.inspect .acts{display:flex; gap:6px; flex-wrap:wrap}
.inspect .acts .btn{padding:4px 10px; font-size:12.5px}

/* Workspace */
.work{display:grid; grid-template-columns:1fr 1fr; gap:12px; min-width:0}
.view{display:flex; flex-direction:column; min-width:0}
.stage{height:440px; position:relative; background:var(--stage); border-radius:0 0 10px 10px; overflow:hidden}
#plan{width:100%; height:100%; display:block; touch-action:none}
#three{position:absolute; inset:0}
#three canvas{display:block}
.drop-on{outline:2px dashed var(--accent); outline-offset:-6px}
.views{display:flex; gap:4px}
.views .btn{padding:2px 8px; font-size:12px}

/* Budget */
.est{padding:4px 0 0}
.est table{width:100%; border-collapse:collapse; font-size:12.5px}
.est td{padding:6px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.est td.n{text-align:right; font-family:var(--font-data); font-variant-numeric:tabular-nums; white-space:nowrap; direction:ltr}
.est .grp td{background:var(--sunk); color:var(--muted); font-size:11.5px; letter-spacing:.3px; padding-block:4px}
.est .sub{display:block; color:var(--muted); font-size:11.5px; font-family:var(--font-data); direction:ltr; text-align:end}
.total{display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px; font-weight:600}
.total .n{font-family:var(--font-data); font-size:18px; direction:ltr}
.note{font-size:11.5px; color:var(--muted); padding:0 14px 12px; margin:0}

/* Modal */
.modal{position:fixed; inset:0; background:rgba(10,14,13,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:760px; width:100%; max-height:90vh; overflow:auto; display:grid; grid-template-columns:1.2fr 1fr; gap:0}
.sheet img{width:100%; height:100%; object-fit:cover; display:block; border-radius:12px 0 0 12px; min-height:260px}
.sheet .txt{padding:18px; display:flex; flex-direction:column; gap:10px}
.sheet h3{margin:0; font-size:16px; text-wrap:balance}
.sheet ol{margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.sheet p{margin:0; font-size:12.5px; color:var(--muted)}

.sheet2{background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:1100px; width:100%; max-height:92vh; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.mhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.mhead h3{margin:0; font-size:16px}
.mstatus{font-size:12.5px; color:var(--muted)}
.mstatus.err{color:#c0392b}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pair figure{margin:0; display:flex; flex-direction:column; gap:6px; min-width:0}
.pair img{width:100%; border-radius:8px; display:block; background:var(--stage)}
.pair figcaption{font-size:12px; color:var(--muted)}
.out{position:relative; min-height:200px; border-radius:8px; background:var(--stage); display:flex; align-items:center; justify-content:center}
.spin{font-size:13px; color:var(--muted); padding:20px; text-align:center}
.coderow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px}
.coderow input{padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--sunk)}
details{font-size:12.5px; color:var(--muted)}
details p{margin:6px 0 0; font-family:var(--font-data); font-size:11.5px; line-height:1.6; text-align:left}
.acts2{display:flex; gap:8px; flex-wrap:wrap}
.acts2 a.btn{text-decoration:none}
@media (max-width:1150px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .budget{grid-column:1 / -1}
  .work{grid-template-columns:1fr}
  .stage{height:380px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .lib{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); max-height:none}
  .stage{height:330px}
  .pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><strong>RoomPitch</strong><span class="tag">Real render test · Cloudflare</span></div>
    <div class="dims">
      <label for="dimL">Length <input id="dimL" type="number" min="2" max="12" step="0.1" value="5"> m</label>
      <label for="dimW">Width <input id="dimW" type="number" min="2" max="12" step="0.1" value="4"> m</label>
      <label for="dimH">Height <input id="dimH" type="number" min="2.2" max="5" step="0.05" value="2.8"> m</label>
    </div>
    <button class="btn primary" id="renderBtn" type="button">Photoreal render</button>
  </header>

  <main class="app">
    <aside class="panel">
      <h2>Library <small>Drag and drop</small></h2>
      <div class="inspect" id="inspect"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-furn" aria-selected="true" data-tab="furn">Furniture</button>
        <button role="tab" id="tab-wall" aria-selected="false" data-tab="wall">Walls</button>
        <button role="tab" id="tab-floor" aria-selected="false" data-tab="floor">Floors</button>
      </div>
      <div class="lib" id="lib"></div>
      <p class="hint" id="hint"></p>
    </aside>

    <section class="work">
      <div class="panel view">
        <h2>Floor plan <small>Drag pieces to move them · click a wall to select it</small></h2>
        <div class="stage"><svg id="plan" aria-label="Room floor plan"></svg></div>
      </div>
      <div class="panel view">
        <h2>3D <small>Drag pieces to move · double-click or R to rotate</small> <span class="views"><button class="btn" type="button" id="camCorner">Corner</button><button class="btn" type="button" id="camDoor">From door</button><button class="btn" type="button" id="camTop">Top</button></span></h2>
        <div class="stage"><div id="three"></div></div>
      </div>
    </section>

    <aside class="panel budget">
      <h2>Estimate <small>Updates as you design</small></h2>
      <div class="est" id="est"></div>
    </aside>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet2" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h3 id="mTitle">Photoreal render</h3><span class="mstatus" id="mStatus"></span></div>
    <div class="pair">
      <figure><img id="shot" alt="Snapshot of the 3D scene"><figcaption>Your scene (sent to the AI)</figcaption></figure>
      <figure><div class="out"><img id="outImg" alt="Photoreal render" hidden><div class="spin" id="spin">Rendering…</div></div><figcaption>AI render</figcaption></figure>
    </div>
    <div class="coderow" id="codeRow" hidden>
      <label for="accessCode">Access code (ACCESS_CODE in your .env file)</label>
      <input id="accessCode" type="password" autocomplete="off">
      <button class="btn" id="codeGo" type="button">Send</button>
    </div>
    <details><summary>Prompt sent to the AI</summary><p id="promptTxt" dir="ltr"></p></details>
    <div class="acts2">
      <button class="btn primary" id="again" type="button">Render again</button>
      <a class="btn" id="saveImg" download="roompitch-render.jpg" hidden>Save image</a>
      <button class="btn" id="closeModal" type="button">Back to design</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
(() => {
  /* ───────── Catalog (example prices, EGP) ───────── */
  const WALL_MATS = [
    {id:"bare-wall",   name:"Bare plaster (unfinished)", price:0, kind:"concrete", c:"#b9b4aa", tile:2},
    {id:"paint-white", name:"Matte white paint", price:180, kind:"paint", c:"#ecebe6", tile:1},
    {id:"paint-sage",  name:"Sage green paint", price:200, kind:"paint", c:"#a7b59d", tile:1},
    {id:"paint-clay",  name:"Terracotta paint", price:200, kind:"paint", c:"#c9917a", tile:1},
    {id:"wood-panel",  name:"Wood panelling",     price:1400, kind:"panel", c:"#9a6b43", tile:1.2},
    {id:"marble-wall", name:"Carrara marble",     price:2200, kind:"marble", c:"#e7e6e2", tile:1.4},
    {id:"wallpaper",   name:"Wallpaper",       price:450, kind:"wallpaper", c:"#d6cbb5", tile:.7}
  ];
  const FLOOR_MATS = [
    {id:"bare-floor",   name:"Bare screed (unfinished)", price:0, kind:"concrete", c:"#a9a49b", tile:2},
    {id:"oak",          name:"Oak parquet",     price:900,  kind:"parquet", c:"#b98b5b", tile:1.4},
    {id:"porcelain",    name:"Porcelain 60×120",  price:650,  kind:"tiles",   c:"#d8d5cf", tile:1.2},
    {id:"marble-floor", name:"Marble",            price:2400, kind:"marble",  c:"#efeeea", tile:1.6},
    {id:"concrete",     name:"Polished concrete",   price:550,  kind:"concrete",c:"#9d9f9d", tile:2}
  ];
  const FURN = [
    {id:"sofa",     name:"3-seat sofa",  w:2.2, d:.9,  h:.85, price:18000, c:"#7b898d"},
    {id:"armchair", name:"Armchair",          w:.85, d:.85, h:.85, price:6500,  c:"#c2a078"},
    {id:"ctable",   name:"Coffee table",    w:1.2, d:.6,  h:.4,  price:4500,  c:"#5a4030"},
    {id:"tvunit",   name:"TV unit",   w:1.8, d:.45, h:.5,  price:9000,  c:"#3a3936"},
    {id:"rug",      name:"Rug",          w:2.4, d:1.7, h:.01, price:5500,  c:"#b5a189"},
    {id:"dtable",   name:"Dining table (6)",   w:1.8, d:.9,  h:.75, price:14000, c:"#6b4a33"},
    {id:"bed",      name:"Bed 160",       w:1.7, d:2.1, h:1,   price:16000, c:"#d4cec2"},
    {id:"plant",    name:"Plant",     w:.45, d:.45, h:1.2, price:1200,  c:"#4e7a4a"}
    // Real 3D models from the models/ folder are added on page load (see loadModelCatalog).
  ];
  const byId = (arr) => Object.fromEntries(arr.map(o => [o.id, o]));
  const WM = byId(WALL_MATS), FM = byId(FLOOR_MATS), FU = byId(FURN);
  const WALL_NAMES = {n:"North wall (window)", e:"East wall", s:"South wall (door)", w:"West wall"};
  const DOOR = {from:.6, w:.9, h:2.1};             // on south wall, measured from west corner
  const WIN  = {w:1.6, sill:.9, h:1.3};            // centred on north wall

  /* ───────── State (example living room) ───────── */
  const S = {
    L:5, W:4, H:2.8,
    walls:{n:"paint-white", e:"wood-panel", s:"paint-white", w:"paint-sage"},
    floor:"oak",
    items:[
      {id:1, type:"rug",      x:2.45, y:2,    rot:90},
      {id:2, type:"sofa",     x:.5,   y:2,    rot:90},
      {id:3, type:"ctable",   x:2.2,  y:2,    rot:90},
      {id:4, type:"tvunit",   x:4.75, y:2,    rot:270},
      {id:5, type:"armchair", x:2.6,  y:.75,  rot:0},
      {id:6, type:"plant",    x:4.65, y:.4,   rot:0}
    ],
    sel:null, tab:"furn", nextId:7,
    replacing:null            // id of the item waiting to be swapped
  };

  const $ = (s) => document.querySelector(s);
  const fmt = (n) => Math.round(n).toLocaleString("en-US");
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const snap = (v) => Math.round(v * 20) / 20;
  const foot = (it) => { const f = FU[it.type]; return (it.rot % 180) ? {w:f.d, d:f.w} : {w:f.w, d:f.d}; };
  const wallLen = (k) => (k === "n" || k === "s") ? S.L : S.W;

  function shade(hex, p){
    const n = parseInt(hex.slice(1), 16); const ch = [n >> 16, (n >> 8) & 255, n & 255];
    const f = (v) => clamp(Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p), 0, 255);
    return `rgb(${ch.map(f).join(",")})`;
  }
  function rng(seed){ let s = seed % 2147483647 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  /* ───────── Material textures (drawn once, shared by swatches and 3D) ───────── */
  const texCache = {};
  function matCanvas(m){
    if (texCache[m.id]) return texCache[m.id];
    const N = 256, c = document.createElement("canvas"); c.width = c.height = N;
    const x = c.getContext("2d"), r = rng([...m.id].reduce((a, ch) => a * 31 + ch.charCodeAt(0), 7));
    x.fillStyle = m.c; x.fillRect(0, 0, N, N);
    const noise = (a, n = 2200) => { for (let i = 0; i < n; i++){ x.fillStyle = r() < .5 ? `rgba(0,0,0,${a * r()})` : `rgba(255,255,255,${a * r()})`; x.fillRect(r() * N, r() * N, 2, 2); } };
    switch (m.kind){
      case "paint": noise(.035); break;
      case "panel":
        for (let i = 0; i < 4; i++){
          x.fillStyle = shade(m.c, (r() - .5) * .2); x.fillRect(i * N / 4, 0, N / 4, N);
          for (let k = 0; k < 12; k++){ x.strokeStyle = `rgba(40,20,5,${.06 + r() * .1})`; x.lineWidth = 1; x.beginPath(); const gx = i * N / 4 + r() * N / 4; x.moveTo(gx, 0); x.bezierCurveTo(gx + 6, N * .3, gx - 6, N * .6, gx + 3, N); x.stroke(); }
          x.fillStyle = "rgba(0,0,0,.4)"; x.fillRect(i * N / 4, 0, 2, N);
        } break;
      case "marble":
        noise(.025);
        for (let k = 0; k < 7; k++){ x.strokeStyle = `rgba(95,95,100,${.12 + r() * .25})`; x.lineWidth = .6 + r() * 1.6; x.beginPath(); let px = r() * N, py = 0; x.moveTo(px, py); for (let s = 0; s < 6; s++){ px += (r() - .5) * 90; py += N / 6; x.lineTo(px, py); } x.stroke(); }
        break;
      case "wallpaper":
        noise(.03);
        for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++){ x.fillStyle = shade(m.c, -.16); x.save(); x.translate(i * 32 + 16 + (j % 2) * 16 - 8, j * 32 + 16); x.rotate(Math.PI / 4); x.fillRect(-5, -5, 10, 10); x.restore(); }
        break;
      case "parquet": {
        const rows = 8, pl = N / 1.5;
        for (let j = 0; j < rows; j++){
          const off = ((j * 37) % 3) * pl / 3;
          for (let i = -1; i < 3; i++){ x.fillStyle = shade(m.c, (r() - .5) * .22); x.fillRect(off + i * pl, j * N / rows, pl, N / rows); x.fillStyle = "rgba(50,25,5,.35)"; x.fillRect(off + i * pl, j * N / rows, 1.5, N / rows); }
          x.fillStyle = "rgba(50,25,5,.35)"; x.fillRect(0, j * N / rows, N, 1.5);
        }
        noise(.04); break;
      }
      case "tiles":
        noise(.03); x.fillStyle = "rgba(0,0,0,.18)"; x.fillRect(0, 0, N, 2); x.fillRect(0, 0, 2, N); x.fillRect(N / 2, 0, 2, N); break;
      case "concrete":
        noise(.08, 5000);
        for (let k = 0; k < 18; k++){ x.fillStyle = `rgba(0,0,0,${r() * .05})`; x.beginPath(); x.arc(r() * N, r() * N, 10 + r() * 40, 0, 7); x.fill(); }
        break;
    }
    return (texCache[m.id] = c);
  }
  const swatchURL = (m) => matCanvas(m).toDataURL("image/png");

  /* ───────── Library ───────── */
  const HINTS = {
    furn: "Drag a piece onto the plan or the 3D view, or click it to place it in the middle of the room.",
    wall: "Drag a finish onto any wall, or select a wall and click a finish.",
    floor:"Drag a finish onto the floor, or click it."
  };
  function renderLib(){
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === S.tab)));
    const lib = $("#lib"); lib.innerHTML = "";
    lib.classList.toggle("replacing", Boolean(S.replacing) && S.tab === "furn");
    const list = S.tab === "furn" ? FURN : S.tab === "wall" ? WALL_MATS : FLOOR_MATS;
    for (const o of list){
      const t = document.createElement("button");
      t.type = "button"; t.className = "tile"; t.draggable = true; t.title = o.name;
      if (S.tab === "furn"){
        const k = 38 / Math.max(o.w, o.d);

  /* ───────── 3D (three.js) ───────── */
  const host = $("#three");

        break;
      case "armchair":
        box(w, .42, d, 0, .21, 0, c); box(w, .44, .18, 0, .64, -d / 2 + .09, shade(c, -.1));
        box(.12, .2, d, -w / 2 + .06, .52, 0, c); box(.12, .2, d, w / 2 - .06, .52, 0, c); break;
      case "ctable": case "dtable": {
        box(w, .05, d, 0, h - .025, 0, c);
        for (const sx of [-1, 1]) for (const sz of [-1, 1]) box(.05, h - .05, .05, sx * (w / 2 - .07), (h - .05) / 2, sz * (d / 2 - .07), shade(c, -.2));
        if (it.type === "dtable") for (let i = 0; i < 3; i++) for (const sz of [-1, 1]){
          const x = -w / 2 + (i + .5) * w / 3, z = sz * (d / 2 + .25);
          box(.42, .05, .42, x, .45, z, "#8b7a68"); box(.42, .45, .04, x, .7, z + sz * .19, "#8b7a68");
        }
        break;
      }
      case "tvunit":
        box(w, h, d, 0, h / 2, 0, c); box(1.25, .72, .04, 0, h + .55, -d / 2 + .08, "#141414"); break;
      case "rug":
        box(w, .012, d, 0, .006, 0, c, false); break;
      case "bed":
        box(w, .32, d, 0, .16, 0, "#8a7a66"); box(w - .06, .2, d - .12, 0, .42, .04, c);
        box(w, 1, .08, 0, .5, -d / 2 + .04, "#7a6a58");
        box(.6, .12, .35, -w / 4, .58, -d / 2 + .32, "#f1eee8"); box(.6, .12, .35, w / 4, .58, -d / 2 + .32, "#f1eee8"); break;
      case "plant": {
        const pot = new THREE.Mesh(new THREE.CylinderGeometry(.17, .13, .4, 20), new THREE.MeshStandardMaterial({color:0xd6d0c4, roughness:.9}));
        pot.position.y = .2; pot.castShadow = true; g.add(pot);
        for (let i = 0; i < 4; i++){
          const s = new THREE.Mesh(new THREE.SphereGeometry(.2 + i * .02, 16, 12), new THREE.MeshStandardMaterial({color:new THREE.Color(shade(c, (i - 1.5) * .08)), roughness:.9}));
          s.position.set(Math.sin(i * 1.7) * .09, .62 + i * .14, Math.cos(i * 1.7) * .09); s.castShadow = true; g.add(s);
        }
        break;
      }
    }
    g.userData = {kind:"item", id:it.id};
    g.traverse(n => { n.userData.itemId = it.id; });
    return g;
  }
  function placeObj(obj, it){ obj.position.set(it.x - S.L / 2, 0, it.y - S.W / 2); obj.rotation.y = it.rot * Math.PI / 180; }
  function buildItems(){
    clearGroup(itemGroup); itemObjs.clear();
    for (const it of S.items){ const o = buildItem(it); placeObj(o, it); itemGroup.add(o); itemObjs.set(it.id, o); }
    refreshHelper();
  }
  function syncItem(it){ const o = itemObjs.get(it.id); if (o){ placeObj(o, it); refreshHelper(); } }
  function refreshHelper(){
    if (selHelper){ scene.remove(selHelper); selHelper.geometry.dispose(); selHelper = null; }
    if (S.sel && S.sel.kind === "item"){
      const o = itemObjs.get(S.sel.id);
      if (o){ selHelper = new THREE.BoxHelper(o, new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue("--accent").trim())); scene.add(selHelper); }
    }
  }

  function setCam(view){
    const {L, W, H} = S; controls.target.set(0, .9, 0);
    if (view === "door") camera.position.set(DOOR.from + DOOR.w / 2 - L / 2, 1.6, W / 2 + .2);
    else if (view === "top") camera.position.set(0, Math.max(L, W) * 1.7, .01);
    else camera.position.set(L * .85, H * 1.9, W * 1.25);
    controls.update();
  }
  $("#camCorner").onclick = () => setCam("corner"); $("#camDoor").onclick = () => setCam("door"); $("#camTop").onclick = () => setCam("top");

  function resize(){
    const r = host.getBoundingClientRect(); if (!r.width || !r.height) return;
    renderer.setSize(r.width, r.height, false); renderer.domElement.style.width = r.width + "px"; renderer.domElement.style.height = r.height + "px";
    camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(host);
  (function loop(){ controls.update(); if (selHelper) selHelper.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

  // picking in 3D (click without dragging the camera)
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function hit3D(clientX, clientY, objs){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera); return ray.intersectObjects(objs, true)[0] || null;
  }
  // Where the pointer meets the floor, in room coordinates (metres from the north-west corner).
  const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0), floorHit = new THREE.Vector3();
  function floorPoint(clientX, clientY){
    const r = renderer.domElement.getBoundingClientRect();
    ndc.set(((clientX - r.left) / r.width) * 2 - 1, -((clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    return ray.ray.intersectPlane(floorPlane, floorHit) ? {x:floorHit.x + S.L / 2, y:floorHit.z + S.W / 2} : null;
  }

  // Drag furniture across the floor in 3D (the camera stays still while dragging; the plan follows live).
  let down = null, drag3 = null;
  const cv = renderer.domElement;
  cv.addEventListener("pointerdown", e => {
    down = {x:e.clientX, y:e.clientY};
    const h = hit3D(e.clientX, e.clientY, itemGroup.children), id = h && h.object.userData.itemId;
    const it = id && S.items.find(i => i.id === id), p = it && floorPoint(e.clientX, e.clientY);
    if (!p) return;
    drag3 = {it, dx:p.x - it.x, dy:p.y - it.y, moved:false};
    e.stopImmediatePropagation();   // keep OrbitControls from starting an orbit under the drag
    controls.enabled = false; cv.setPointerCapture(e.pointerId); cv.style.cursor = "grabbing";
    if (!(S.sel && S.sel.kind === "item" && S.sel.id === id)){ S.sel = {kind:"item", id}; renderInspect(); renderPlan(); refreshHelper(); }
  }, {capture:true});
  cv.addEventListener("pointermove", e => {
    if (drag3){
      const p = floorPoint(e.clientX, e.clientY); if (!p) return;
      drag3.it.x = snap(p.x - drag3.dx); drag3.it.y = snap(p.y - drag3.dy); clampItem(drag3.it);
      drag3.moved = true; syncItem(drag3.it); renderPlan();
      return;
    }
    if (e.buttons) return; // orbiting
    const h = hit3D(e.clientX, e.clientY, itemGroup.children);
    cv.style.cursor = h && h.object.userData.itemId ? "grab" : "";
  });
  const endDrag3 = () => {
    if (!drag3) return false;
    const moved = drag3.moved; drag3 = null;
    controls.enabled = true; cv.style.cursor = "grab";
    if (moved){ renderEst(); renderInspect(); }
    return true;
  };
  cv.addEventListener("pointercancel", () => { endDrag3(); down = null; });
  cv.addEventListener("dblclick", e => {
    const h = hit3D(e.clientX, e.clientY, itemGroup.children);
    if (h && h.object.userData.itemId){ S.sel = {kind:"item", id:h.object.userData.itemId}; rotateSel(); }
  });
  cv.addEventListener("pointerup", e => {
    if (endDrag3()){ down = null; return; }   // a press on a piece is a move (or a select), never a click-through
    if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 5){ down = null; return; }
    down = null;
    const h = hit3D(e.clientX, e.clientY, [...itemGroup.children, ...pickables]);
    if (!h){ S.sel = null; }
    else if (h.object.userData.itemId) S.sel = {kind:"item", id:h.object.userData.itemId};
    else if (h.object.userData.kind === "wall") S.sel = {kind:"wall", id:h.object.userData.id};
    else S.sel = {kind:"floor"};
    update(true);
  });
  host.addEventListener("dragover", e => { e.preventDefault(); host.parentElement.classList.add("drop-on"); });
  host.addEventListener("dragleave", () => host.parentElement.classList.remove("drop-on"));
  host.addEventListener("drop", e => {
    e.preventDefault(); host.parentElement.classList.remove("drop-on");
    const payload = e.dataTransfer.getData("text/plain"); if (!payload) return;
    if (payload.startsWith("furn:")){
      const hi = hit3D(e.clientX, e.clientY, itemGroup.children);
      if (hi && hi.object.userData.itemId && FU[S.items.find(i => i.id === hi.object.userData.itemId).type].id !== "rug")
        return applyPayload(payload, {kind:"item", id:hi.object.userData.itemId});
    }
    const h = hit3D(e.clientX, e.clientY, pickables);
    if (!h) return applyPayload(payload, null);
    if (payload.startsWith("furn:")) return applyPayload(payload, {kind:"point", x:h.point.x + S.L / 2, y:h.point.z + S.W / 2});
    if (h.object.userData.kind === "wall") return applyPayload(payload, {kind:"wall", id:h.object.userData.id});
    applyPayload(payload, {kind:"floor"});
  });

  /* ───────── Dimensions, render mock, update loop ───────── */
  for (const id of ["dimL", "dimW", "dimH"]){
    $("#" + id).addEventListener("change", () => {
      S.L = clamp(parseFloat($("#dimL").value) || 5, 2, 12);
      S.W = clamp(parseFloat($("#dimW").value) || 4, 2, 12);
      S.H = clamp(parseFloat($("#dimH").value) || 2.8, 2.2, 5);
      $("#dimL").value = S.L; $("#dimW").value = S.W; $("#dimH").value = S.H;
      S.items.forEach(clampItem); update(true); buildItems(); setCam("corner");
    });
  }
  /* ───────── Real render through /api/generate (Cloudflare Workers AI by default) ───────── */
  const EN = {
    "bare-wall":"bare grey plaster", "paint-white":"matte white paint", "paint-sage":"sage green matte paint",
    "paint-clay":"warm terracotta matte paint", "wood-panel":"vertical walnut wood panelling", "marble-wall":"white Carrara marble slabs",
    "wallpaper":"beige wallpaper with a small diamond pattern",
    "bare-floor":"bare grey cement screed", "oak":"light oak parquet", "porcelain":"large-format light grey porcelain tiles",
    "marble-floor":"polished white marble", "concrete":"polished grey concrete",
    sofa:"grey fabric three-seat sofa", armchair:"tan upholstered armchair", ctable:"dark walnut coffee table",
    tvunit:"low dark TV cabinet with a TV above it", rug:"large beige area rug", dtable:"walnut dining table with six chairs",
    bed:"double bed with light linen bedding and a wooden headboard", plant:"tall green plant in a ceramic pot"
  };
  const WALL_EN = {n:"the back wall with the window", s:"the wall with the door", e:"the right-hand wall (when facing the window)", w:"the left-hand wall (when facing the window)"};
  const FACE_EN = {0:"facing the door wall", 90:"facing the right-hand wall", 180:"facing the window wall", 270:"facing the left-hand wall"};
  function placeEn(it){
    if (it.type === "rug") return "on the floor";
    const f = foot(it), gaps = {n:it.y - f.d / 2, s:S.W - it.y - f.d / 2, w:it.x - f.w / 2, e:S.L - it.x - f.w / 2};
    const k = Object.keys(gaps).sort((a, b) => gaps[a] - gaps[b])[0];
    const where = gaps[k] < .35 ? `against ${WALL_EN[k]}` : "in the middle of the room";
    return it.type === "plant" ? where : `${where}, ${FACE_EN[it.rot]}`;
  }
  function describeScene(){
    const walls = ["n", "e", "s", "w"].map(k => `${WALL_EN[k]}: ${EN[S.walls[k]]}`).join("; ");
    const items = S.items.map(it => { const f = FU[it.type]; return `${EN[it.type]} (${Math.round(f.w * 100)} x ${Math.round(f.d * 100)} cm) ${placeEn(it)}`; }).join("; ");
    return [
      `Turn this simple 3D block model into a photorealistic interior design photograph of a room ${S.L} m long and ${S.W} m wide with a ${S.H} m ceiling.`,
      "Keep exactly the same camera angle, perspective, room shape, walls, door and window.",
      "Each coloured block is a piece of furniture: keep every piece in exactly the same position, size and orientation. Do not add, remove or move any furniture.",
      `Floor: ${EN[S.floor]}.`,
      `Walls: ${walls}.`,
      items ? `Furniture: ${items}.` : "The room has no furniture.",
      "Soft natural daylight from the window, realistic materials, textures and soft shadows, professional architectural interior photography, high detail. No people, no text, no watermark."
    ].join(" ").slice(0, 2900); // the server rejects prompts over 3000 characters
  }

  let cfg = null, job = null;
  async function getCfg(){
    if (cfg) return cfg;
    try { const r = await fetch("/api/generate"); cfg = await r.json(); }
    catch { cfg = {aiEnabled:false, offline:true}; }
    return cfg;
  }
  const getCode = () => { try { return JSON.parse(localStorage.getItem("rp_settings") || "{}").accessCode || ""; } catch { return ""; } };
  const setCode = (v) => { try { const s = JSON.parse(localStorage.getItem("rp_settings") || "{}"); s.accessCode = v; localStorage.setItem("rp_settings", JSON.stringify(s)); } catch {} };

  // Capture the 3D view without the selection outline. `small` respects the provider's input size limit.
  function snapshot(maxSide){
    const keep = S.sel; S.sel = null; buildRoom(); refreshHelper(); renderer.render(scene, camera);
    const src = renderer.domElement, k = Math.min(1, maxSide / Math.max(src.width, src.height));
    const c = document.createElement("canvas");
    c.width = Math.max(8, Math.floor(src.width * k / 8) * 8); c.height = Math.max(8, Math.floor(src.height * k / 8) * 8);
    c.getContext("2d").drawImage(src, 0, 0, c.width, c.height);
    const shot = {full:src.toDataURL("image/jpeg", .9), small:c.toDataURL("image/jpeg", .92), aspect:src.width / src.height};
    S.sel = keep; update();
    return shot;
  }
  function setStatus(msg, err = false){ const s = $("#mStatus"); s.textContent = msg; s.classList.toggle("err", err); }

  async function runRender(){
    $("#codeRow").hidden = true; $("#outImg").hidden = true; $("#saveImg").hidden = true;
    $("#spin").hidden = false; $("#spin").textContent = "Rendering…"; setStatus("");
    const c = await getCfg();
    if (!job){
      const shot = snapshot(c.maxInputSide || 1024);
      const outW = shot.aspect >= 1 ? 1024 : Math.round(1024 * shot.aspect);
      const outH = shot.aspect >= 1 ? Math.round(1024 / shot.aspect) : 1024;
      job = {shot, prompt:describeScene(), outW, outH};
    }
    $("#shot").src = job.shot.full; $("#promptTxt").textContent = job.prompt;
    if (!c.aiEnabled){
      $("#spin").textContent = c.offline
        ? "Open this page through the server: run node dev-server.mjs and go to http://localhost:3000/studio.html"
        : "No AI keys in .env. Add CF_ACCOUNT_ID and CF_API_TOKEN, then restart the server.";
      setStatus("Rendering is off", true); return;
    }
    setStatus(`Sending to ${c.provider === "cloudflare" ? "Cloudflare Workers AI" : c.provider}…`);
    const t0 = performance.now();
    try {
      const r = await fetch("/api/generate", {
        method:"POST",
        headers:{"Content-Type":"application/json", "x-access-code":getCode()},
        body:JSON.stringify({mode:"restyle", image:job.shot.small, prompt:job.prompt, width:job.outW, height:job.outH})
      });
      if (r.status === 401){ $("#codeRow").hidden = false; $("#spin").textContent = "Access code needed"; setStatus("Enter the code from your .env file", true); $("#accessCode").focus(); return; }
      const data = await r.json().catch(() => ({}));
      if (!r.ok || !data.image){ $("#spin").textContent = data.error || `Something went wrong (${r.status})`; setStatus("Render failed", true); return; }
      const secs = ((performance.now() - t0) / 1000).toFixed(1);
      $("#outImg").src = data.image; $("#outImg").hidden = false; $("#spin").hidden = true;
      $("#saveImg").href = data.image; $("#saveImg").hidden = false;
      setStatus(`Done in ${secs} s · ${c.provider === "cloudflare" ? "Cloudflare" : c.provider}`);
    } catch (e){
      $("#spin").textContent = "Could not reach the server. Make sure node dev-server.mjs is running."; setStatus("Render failed", true);
    }
  }

  $("#renderBtn").onclick = () => { job = null; $("#modal").hidden = false; runRender(); };
  $("#again").onclick = () => runRender();        // same scene, new attempt
  $("#codeGo").onclick = () => { setCode($("#accessCode").value.trim()); runRender(); };
  $("#closeModal").onclick = () => { $("#modal").hidden = true; };
  $("#modal").addEventListener("click", e => { if (e.target.id === "modal") $("#modal").hidden = true; });

  let lastItemsKey = "";
  function update(){
    renderPlan(); renderInspect(); renderEst();
    buildRoom(); // cheap; also refreshes the selected-wall highlight
    const key = S.items.map(i => `${i.id}:${i.type}:${i.rot}`).join("|");
    if (key !== lastItemsKey){ lastItemsKey = key; buildItems(); }
    else { S.items.forEach(syncItem); refreshHelper(); }
  }

  // Add every model found in models/ to the furniture library (real size from the file, placeholder price).
  async function loadModelCatalog(){
    try {
      const r = await fetch("/api/models");
      if (!r.ok) return;
      const {models = []} = await r.json();
      for (const m of models){
        if (FU[m.id]) continue;
        FURN.push(m); FU[m.id] = m;
        EN[m.id] = m.name.toLowerCase();   // used in the AI render description
      }
      if (models.length) renderLib();
    } catch { /* page opened without the server: keep the built-in catalog */ }
  }

  renderLib(); resize(); update(true); setCam("corner");
  loadModelCatalog();
})();
</script>

</body>
</html>
