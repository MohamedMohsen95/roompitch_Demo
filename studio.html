<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RoomPitch Room Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drafting-table workspace. Library on the left, plan + 3D side by side in the middle, live estimate on the right. */
:root{
  --bg:#e9ecea; --surface:#ffffff; --sunk:#f3f5f4; --ink:#1b2220; --muted:#5f6b67; --line:#d3d9d6;
  --accent:#2c6a5c; --accent-ink:#ffffff; --accent-soft:rgba(44,106,92,.12); --stage:#dfe4e1; --grid:rgba(27,34,32,.07);
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "Cascadia Mono", monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121615; --surface:#1a1f1e; --sunk:#151a19; --ink:#e6ebe9; --muted:#97a39f; --line:#2b3331;
  --accent:#5fb39d; --accent-ink:#0d1211; --accent-soft:rgba(95,179,157,.16); --stage:#202725; --grid:rgba(230,235,233,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121615; --surface:#1a1f1e; --sunk:#151a19; --ink:#e6ebe9; --muted:#97a39f; --line:#2b3331;
  --accent:#5fb39d; --accent-ink:#0d1211; --accent-soft:rgba(95,179,157,.16); --stage:#202725; --grid:rgba(230,235,233,.06); color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.5}
.wrap{padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px)); padding-block:14px 24px; display:flex; flex-direction:column; gap:12px}
button,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* Top bar */
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 14px}
.brand{display:flex; align-items:baseline; gap:10px; margin-inline-end:auto}
.brand strong{font-size:17px; letter-spacing:.2px}
.tag{font-size:12px; color:var(--muted); border:1px dashed var(--line); padding:1px 8px; border-radius:20px}
.dims{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.dims label{display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted)}
.dims input{width:64px; padding:5px 6px; border:1px solid var(--line); border-radius:6px; background:var(--sunk); font-family:var(--font-data); text-align:center; direction:ltr}
.btn{border:1px solid var(--line); background:var(--sunk); padding:6px 12px; border-radius:7px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; padding:8px 18px}

/* Main grid */
.app{display:grid; grid-template-columns:250px minmax(0,1fr) 270px; gap:12px; align-items:start}
.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; min-width:0}
.panel h2{font-size:13px; font-weight:600; margin:0; padding:10px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:8px}
.panel h2 small{font-weight:400; color:var(--muted); font-size:12px}

/* Library */
.tabs{display:flex; gap:4px; padding:10px 10px 0}
.tabs button{flex:1; border:1px solid var(--line); background:var(--sunk); border-radius:7px; padding:6px 4px; font-size:13px}
.tabs button[aria-selected="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--ink); font-weight:600}
.lib{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; padding:10px; max-height:430px; overflow:auto}
.tile{min-width:0; border:1px solid var(--line); background:var(--sunk); border-radius:8px; padding:6px; text-align:start; display:flex; flex-direction:column; gap:5px; cursor:grab; user-select:none; touch-action:manipulation}
.tile:hover{border-color:var(--accent)}
.tile:active{cursor:grabbing}
.lib.replacing .tile{border-color:var(--accent); background:var(--accent-soft)}
.sw{height:46px; border-radius:5px; background-size:cover; border:1px solid var(--line); position:relative}
.sw .fp{position:absolute; inset:0; margin:auto; border-radius:2px}
.tile b{font-size:12.5px; font-weight:500; line-height:1.3; overflow-wrap:anywhere; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.tile span{font-size:11.5px; color:var(--muted); font-family:var(--font-data); direction:ltr; text-align:end}
.hint{font-size:12px; color:var(--muted); padding:0 12px 12px; margin:0}

.inspect{padding:10px 12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; gap:8px; min-height:62px}
.inspect .what{font-size:13px}
.inspect .what em{font-style:normal; color:var(--muted); font-size:12px; display:block}
.inspect .acts{display:flex; gap:6px; flex-wrap:wrap}
.inspect .acts .btn{padding:4px 10px; font-size:12.5px}

/* Workspace */
.work{display:grid; grid-template-columns:1fr 1fr; gap:12px; min-width:0}
.view{display:flex; flex-direction:column; min-width:0}
.stage{height:440px; position:relative; background:var(--stage); border-radius:0 0 10px 10px; overflow:hidden}
#plan{width:100%; height:100%; display:block; touch-action:none}
#three{position:absolute; inset:0}
#three canvas{display:block}
.drop-on{outline:2px dashed var(--accent); outline-offset:-6px}
.views{display:flex; gap:4px}
.views .btn{padding:2px 8px; font-size:12px}

/* Budget */
.est{padding:4px 0 0}
.est table{width:100%; border-collapse:collapse; font-size:12.5px}
.est td{padding:6px 14px; border-bottom:1px solid var(--line); vertical-align:top}
.est td.n{text-align:right; font-family:var(--font-data); font-variant-numeric:tabular-nums; white-space:nowrap; direction:ltr}
.est .grp td{background:var(--sunk); color:var(--muted); font-size:11.5px; letter-spacing:.3px; padding-block:4px}
.est .sub{display:block; color:var(--muted); font-size:11.5px; font-family:var(--font-data); direction:ltr; text-align:end}
.total{display:flex; justify-content:space-between; align-items:baseline; padding:12px 14px; font-weight:600}
.total .n{font-family:var(--font-data); font-size:18px; direction:ltr}
.note{font-size:11.5px; color:var(--muted); padding:0 14px 12px; margin:0}

/* Modal */
.modal{position:fixed; inset:0; background:rgba(10,14,13,.55); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20}
.sheet{background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:760px; width:100%; max-height:90vh; overflow:auto; display:grid; grid-template-columns:1.2fr 1fr; gap:0}
.sheet img{width:100%; height:100%; object-fit:cover; display:block; border-radius:12px 0 0 12px; min-height:260px}
.sheet .txt{padding:18px; display:flex; flex-direction:column; gap:10px}
.sheet h3{margin:0; font-size:16px; text-wrap:balance}
.sheet ol{margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:6px; font-size:13.5px}
.sheet p{margin:0; font-size:12.5px; color:var(--muted)}

.sheet2{background:var(--surface); border:1px solid var(--line); border-radius:12px; max-width:1100px; width:100%; max-height:92vh; overflow:auto; padding:16px; display:flex; flex-direction:column; gap:12px}
.mhead{display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap}
.mhead h3{margin:0; font-size:16px}
.mstatus{font-size:12.5px; color:var(--muted)}
.mstatus.err{color:#c0392b}
.pair{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.pair figure{margin:0; display:flex; flex-direction:column; gap:6px; min-width:0}
.pair img{width:100%; border-radius:8px; display:block; background:var(--stage)}
.pair figcaption{font-size:12px; color:var(--muted)}
.out{position:relative; min-height:200px; border-radius:8px; background:var(--stage); display:flex; align-items:center; justify-content:center}
.spin{font-size:13px; color:var(--muted); padding:20px; text-align:center}
.coderow{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px}
.coderow input{padding:5px 8px; border:1px solid var(--line); border-radius:6px; background:var(--sunk)}
details{font-size:12.5px; color:var(--muted)}
details p{margin:6px 0 0; font-family:var(--font-data); font-size:11.5px; line-height:1.6; text-align:left}
.acts2{display:flex; gap:8px; flex-wrap:wrap}
.acts2 a.btn{text-decoration:none}
@media (max-width:1150px){
  .app{grid-template-columns:240px minmax(0,1fr)}
  .budget{grid-column:1 / -1}
  .work{grid-template-columns:1fr}
  .stage{height:380px}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .lib{grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); max-height:none}
  .stage{height:330px}
  .pair{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <div class="brand"><strong>RoomPitch</strong><span class="tag">Real render test · Cloudflare</span></div>
    <div class="dims">
      <label for="dimL">Length <input id="dimL" type="number" min="2" max="12" step="0.1" value="5"> m</label>
      <label for="dimW">Width <input id="dimW" type="number" min="2" max="12" step="0.1" value="4"> m</label>
      <label for="dimH">Height <input id="dimH" type="number" min="2.2" max="5" step="0.05" value="2.8"> m</label>
    </div>
    <button class="btn primary" id="renderBtn" type="button">Photoreal render</button>
  </header>

  <main class="app">
    <aside class="panel">
      <h2>Library <small>Drag and drop</small></h2>
      <div class="inspect" id="inspect"></div>
      <div class="tabs" role="tablist">
        <button role="tab" id="tab-furn" aria-selected="true" data-tab="furn">Furniture</button>
        <button role="tab" id="tab-wall" aria-selected="false" data-tab="wall">Walls</button>
        <button role="tab" id="tab-floor" aria-selected="false" data-tab="floor">Floors</button>
      </div>
      <div class="lib" id="lib"></div>
      <p class="hint" id="hint"></p>
    </aside>

    <section class="work">
      <div class="panel view">
        <h2>Floor plan <small>Drag pieces to move them · click a wall to select it</small></h2>
        <div class="stage"><svg id="plan" aria-label="Room floor plan"></svg></div>
      </div>
      <div class="panel view">
        <h2>3D <small>Drag pieces to move · double-click or R to rotate</small> <span class="views"><button class="btn" type="button" id="camCorner">Corner</button><button class="btn" type="button" id="camDoor">From door</button><button class="btn" type="button" id="camTop">Top</button></span></h2>
        <div class="stage"><div id="three"></div></div>
      </div>
    </section>

    <aside class="panel budget">
      <h2>Estimate <small>Updates as you design</small></h2>
      <div class="est" id="est"></div>
    </aside>
  </main>
</div>

<div class="modal" id="modal" hidden>
  <div class="sheet2" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead"><h3 id="mTitle">Photoreal render</h3><span class="mstatus" id="mStatus"></span></div>
    <div class="pair">
      <figure><img id="shot" alt="Snapshot of the 3D scene"><figcaption>Your scene (sent to the AI)</figcaption></figure>
      <figure><div class="out"><img id="outImg" alt="Photoreal render" hidden><div class="spin" id="spin">Rendering…</div></div><figcaption>AI render</figcaption></figure>
    </div>
    <div class="coderow" id="codeRow" hidden>
      <label for="accessCode">Access code (ACCESS_CODE in your .env file)</label>
      <input id="accessCode" type="password" autocomplete="off">
      <button class="btn" id="codeGo" type="button">Send</button>
    </div>
    <details><summary>Prompt sent to the AI</summary><p id="promptTxt" dir="ltr"></p></details>
    <div class="acts2">
      <button class="btn primary" id="again" type="button">Render again</button>
      <a class="btn" id="saveImg" download="roompitch-render.jpg" hidden>Save image</a>
      <button class="btn" id="closeModal" type="button">Back to design</button>
    </div>
  </div>
</div>

<script type="module" src="/src/studio/main.js"></script>

</body>
</html>
